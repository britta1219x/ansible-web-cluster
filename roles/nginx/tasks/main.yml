---
- name: Install Nginx
  dnf:
    name: nginx
    state: present

- name: Ensure Nginx is started and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: Template Nginx main configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx

- name: Template default site configuration
  template:
    src: default.conf.j2
    dest: /etc/nginx/conf.d/default.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Nginx

- name: Create web root directory
  file:
    path: /var/www/html
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Deploy index.html test page
  copy:
    content: |
      <h1>Welcome to Ansible Deployed Web Cluster</h1>
      <p>Node: {{ inventory_hostname }}</p>
      <p>Deployed by Ansible at {{ ansible_date_time.iso8601 }}</p>
    dest: /var/www/html/index.html
    owner: nginx
    group: nginx
    mode: '0644'
