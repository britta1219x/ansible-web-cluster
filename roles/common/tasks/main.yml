---
- name: Update system packages  # noqa: package-latest —— 初始化时有意做全量更新
  ansible.builtin.dnf:
    name: '*'
    state: latest
    update_cache: true

- name: Install common tools and dependencies
  ansible.builtin.dnf:
    name:
      - curl
      - wget
      - vim
      - git
      - net-tools
      - firewalld
      - python3-pip
      - openssl
      - libselinux-python3
    state: present

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Set timezone to Asia/Shanghai
  community.general.timezone:
    name: Asia/Shanghai
